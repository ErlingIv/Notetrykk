<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komposisjon — Norske Notetrykk</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Source+Serif+4:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f7f4ee;
    --paper:   #fffef9;
    --ink:     #1a1814;
    --muted:   #7a7060;
    --faint:   #e8e2d4;
    --accent:  #8b3a1e;
    --accent2: #2a5c45;
    --border:  #d4cdc0;
    --serif:   'Playfair Display', Georgia, serif;
    --body:    'Source Serif 4', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--body); background: var(--bg); color: var(--ink); min-height: 100vh; }

  .site-header {
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .back-link {
    font-size: 0.82rem; color: var(--muted); text-decoration: none;
    letter-spacing: 0.05em; text-transform: uppercase;
    display: flex; align-items: center; gap: 0.3rem; transition: color 0.15s;
  }
  .back-link:hover { color: var(--accent); }
  .site-name {
    font-family: var(--serif); font-size: 1rem; font-weight: 500;
    color: var(--ink); text-decoration: none;
  }
  .site-name:hover { color: var(--accent); }

  main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* ── Hero card ── */
  .comp-hero {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem;
    margin-bottom: 1.5rem;
  }
  .comp-id {
    font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em;
    text-transform: uppercase; margin-bottom: 0.4rem;
  }
  .comp-title {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 700; line-height: 1.1; color: var(--ink);
  }
  .comp-subtitle {
    font-family: var(--serif);
    font-size: 1.1rem; font-style: italic;
    color: var(--muted); margin-top: 0.3rem;
  }

  /* ── Meta grid ── */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--faint);
  }
  .meta-item { }
  .meta-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); font-weight: 500; margin-bottom: 0.25rem;
  }
  .meta-value {
    font-size: 0.92rem; color: var(--ink); line-height: 1.4;
  }
  .meta-value a {
    color: var(--accent2); text-decoration: none;
    border-bottom: 1px solid var(--faint); transition: border-color 0.15s;
  }
  .meta-value a:hover { border-color: var(--accent2); }
  .meta-value.muted { color: var(--muted); font-style: italic; }

  /* ── Instr badge ── */
  .instr-badge {
    display: inline-block; font-size: 0.78rem;
    padding: 3px 10px; border-radius: 4px;
    border: 1px solid var(--border); color: var(--muted);
    background: var(--bg);
  }
  .instr-badge.raw {
    border-color: #c8a84b; color: #7a5c2a; background: #fdf6e3;
  }

  /* ── People section ── */
  .section-heading {
    font-family: var(--serif); font-size: 1.1rem; font-weight: 500;
    color: var(--ink); margin-bottom: 0.75rem;
    padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
  }
  .people-list { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.5rem; }
  .person-row {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.6rem 0.9rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; text-decoration: none; color: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .person-row:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(139,58,30,0.08); }
  .person-name { font-family: var(--serif); font-size: 0.95rem; font-weight: 500; }
  .person-credited { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-top: 1px; }
  .role-badge {
    font-size: 0.68rem; padding: 2px 8px; border-radius: 3px;
    border: 1px solid; white-space: nowrap; flex-shrink: 0;
  }
  .role-Composer  { background: #f0ece4; color: #7a5c30; border-color: #d4c0a0; }
  .role-Lyricist  { background: #eaf3ee; color: #2a5c45; border-color: #b8d4c0; }
  .role-Arranger  { background: #eaf0f8; color: #1a4a6e; border-color: #b8cfe0; }
  .role-Editor    { background: #f4eaf0; color: #5c2a50; border-color: #d0b8cc; }

  /* ── Notes ── */
  .notes-block {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem 1.25rem;
    font-size: 0.88rem; color: var(--muted);
    line-height: 1.7; margin-bottom: 1.5rem;
  }
  .notes-block strong { color: var(--ink); font-weight: 500; }

  /* ── Periodical ── */
  .periodical-block {
    background: var(--paper); border: 1px solid var(--border);
    border-left: 4px solid var(--accent2);
    border-radius: 6px; padding: 0.75rem 1rem;
    font-size: 0.88rem; margin-bottom: 1.5rem;
  }
  .periodical-title { font-family: var(--serif); font-weight: 500; color: var(--ink); }
  .periodical-ref   { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  .loading-state { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
  .error-state   { color: #a32d2d; font-size: 0.9rem; padding: 1.5rem 0; }
</style>
</head>
<body>

<header class="site-header">
  <a class="back-link" href="javascript:history.back()">← Tilbake</a>
  <a class="site-name" href="index.html">Norske Notetrykk 1811–1908</a>
</header>

<main>
  <div id="content"><div class="loading-state">Laster…</div></div>
</main>

<script>
const SUPABASE_URL = 'https://lmsqnyssnxsiibnyguxy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w0SDuDAzg3L0EmtQe4QHDg_T-bW_ADO';
const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

const params = new URLSearchParams(window.location.search);
const compId = params.get('id');

async function load() {
  const el = document.getElementById('content');
  if (!compId) { el.innerHTML = '<p class="error-state">Ingen komposisjons-ID angitt.</p>'; return; }

  try {
    // 1. Composition
    const cR = await fetch(
      `${SUPABASE_URL}/rest/v1/composition?composition_id=eq.${compId}&select=*`,
      { headers: H }
    );
    const comp = (await cR.json())[0];
    if (!comp) throw new Error('Komposisjon ikke funnet');
    document.title = `${comp.title} — Norske Notetrykk`;

    // 2. Publisher
    let publisher = null;
    if (comp.publisher_id) {
      const pR = await fetch(
        `${SUPABASE_URL}/rest/v1/publisher?publisher_id=eq.${comp.publisher_id}&select=publisher_id,publisher_name,city,country`,
        { headers: H }
      );
      publisher = (await pR.json())[0];
    }

    // 3. Instrumentation — load all codes so raw_instrumentation can also be resolved
    let instr = null;
    const rawCodeMap = {};
    const iR = await fetch(
      `${SUPABASE_URL}/rest/v1/instrumentation?select=instrumentation_id,legacy_code,description_no,description_en`,
      { headers: H }
    );
    (await iR.json()).forEach(i => {
      if (i.instrumentation_id === comp.instrumentation_id) instr = i;
      if (i.legacy_code) rawCodeMap[i.legacy_code] = i.description_no;
    });

    // 4. People (all roles)
    const cpR = await fetch(
      `${SUPABASE_URL}/rest/v1/composition_person?composition_id=eq.${compId}&select=person_id,role,credited_as,is_primary`,
      { headers: H }
    );
    const cpRows = await cpR.json();
    const personIds = [...new Set(cpRows.map(r => r.person_id).filter(Boolean))];
    const personMap = {};
    if (personIds.length) {
      const ppR = await fetch(
        `${SUPABASE_URL}/rest/v1/person?person_id=in.(${personIds.join(',')})&select=person_id,first_name,last_name`,
        { headers: H }
      );
      (await ppR.json()).forEach(p => { personMap[p.person_id] = p; });
    }

    // 5. Periodical issues
    const ciR = await fetch(
      `${SUPABASE_URL}/rest/v1/composition_issue?composition_id=eq.${compId}&select=issue_id,plate_number_in_issue`,
      { headers: H }
    );
    const ciRows = await ciR.json();
    const issueIds = ciRows.map(r => r.issue_id).filter(Boolean);
    const issueMap = {};
    if (issueIds.length) {
      const isR = await fetch(
        `${SUPABASE_URL}/rest/v1/periodical_issue?issue_id=in.(${issueIds.join(',')})&select=issue_id,raw_reference,periodical_id`,
        { headers: H }
      );
      const issues = await isR.json();
      const periodicalIds = [...new Set(issues.map(i => i.periodical_id).filter(Boolean))];
      const periodicalMap = {};
      if (periodicalIds.length) {
        const perR = await fetch(
          `${SUPABASE_URL}/rest/v1/periodical?periodical_id=in.(${periodicalIds.join(',')})&select=periodical_id,title,abbreviation`,
          { headers: H }
        );
        (await perR.json()).forEach(p => { periodicalMap[p.periodical_id] = p; });
      }
      issues.forEach(i => { issueMap[i.issue_id] = { ...i, periodical: periodicalMap[i.periodical_id] }; });
    }

    // ── Render ────────────────────────────────────────────────────────────────

    const yearStr = formatYear(comp);
    const instrParts = [];
    if (instr) instrParts.push(`${instr.description_no} (${instr.legacy_code})`);
    if (comp.raw_instrumentation) instrParts.push(`⚠ rå: ${comp.raw_instrumentation}`);
    const instrLabel = instrParts.length ? instrParts.join(' / ') : null;

    // Meta grid items
    const metaItems = [
      { label: 'År', value: yearStr || '—' },
      { label: 'Måned', value: comp.month || null },
      { label: 'Forlag', value: publisher
          ? `<a href="publisher.html?id=${publisher.publisher_id}">${escHtml(publisher.publisher_name)}</a>${publisher.city ? `<br><span style="font-size:0.8rem;color:var(--muted)">${escHtml(publisher.city)}</span>` : ''}`
          : null },
      { label: 'Platenummer', value: comp.plate_number || null },
      { label: 'Besetning', value: instrParts.length ? instrParts.map(p =>
          `<span class="instr-badge${p.startsWith('⚠') ? ' raw' : ''}">${escHtml(p)}</span>`
        ).join(' ') : null },
    ].filter(m => m.value);

    // People
    const roleOrder = ['Composer', 'Lyricist', 'Arranger', 'Editor'];
    const roleLabel = { Composer: 'Komponist', Lyricist: 'Tekstforfatter', Arranger: 'Arrangør', Editor: 'Redaktør' };
    const sortedPeople = [...cpRows].sort((a,b) =>
      roleOrder.indexOf(a.role) - roleOrder.indexOf(b.role)
    );

    const peopleHtml = sortedPeople.length ? `
      <div class="section-heading">Personer</div>
      <div class="people-list">
        ${sortedPeople.map(row => {
          const p = personMap[row.person_id];
          const name = p
            ? (p.last_name ? `${p.last_name}, ${p.first_name || ''}`.trim() : p.first_name || '—')
            : '—';
          return `
            <a class="person-row" href="composer.html?id=${row.person_id}">
              <div>
                <div class="person-name">${escHtml(name)}</div>
                ${row.credited_as ? `<div class="person-credited">Kreditert som: ${escHtml(row.credited_as)}</div>` : ''}
              </div>
              <span class="role-badge role-${row.role}">${roleLabel[row.role] || row.role}</span>
            </a>`;
        }).join('')}
      </div>` : '';

    // Periodicals
    const periodicalHtml = ciRows.length ? `
      <div class="section-heading">Periodikum</div>
      ${ciRows.map(ci => {
        const issue = issueMap[ci.issue_id];
        const per = issue?.periodical;
        return `
          <div class="periodical-block">
            <div class="periodical-title">${per ? escHtml(per.title) : '—'}</div>
            <div class="periodical-ref">
              ${issue?.raw_reference ? `Ref: ${escHtml(issue.raw_reference)}` : ''}
              ${ci.plate_number_in_issue ? ` · Pl. ${escHtml(ci.plate_number_in_issue)}` : ''}
            </div>
          </div>`;
      }).join('')}` : '';

    // Notes
    const notesHtml = comp.composition_notes ? `
      <div class="section-heading">Kommentarer</div>
      <div class="notes-block">${escHtml(comp.composition_notes).replace(/\n/g,'<br>')}</div>` : '';

    el.innerHTML = `
      <div class="comp-hero">
        <div class="comp-id">Komposisjon #${comp.composition_id}</div>
        <h1 class="comp-title">${escHtml(comp.title || '—')}</h1>
        ${comp.subtitle ? `<p class="comp-subtitle">${escHtml(comp.subtitle)}</p>` : ''}
        <div class="meta-grid">
          ${metaItems.map(m => `
            <div class="meta-item">
              <div class="meta-label">${m.label}</div>
              <div class="meta-value">${m.value}</div>
            </div>`).join('')}
        </div>
      </div>

      ${peopleHtml}
      ${periodicalHtml}
      ${notesHtml}
    `;

  } catch(e) {
    document.getElementById('content').innerHTML =
      `<p class="error-state">Feil: ${e.message}</p>`;
  }
}

function formatYear(c) {
  if (!c.year_issued) return '';
  if (c.year_qualifier === 'range' && c.year_issued_end) return `${c.year_issued}–${c.year_issued_end}`;
  if (c.year_qualifier === 'circa')  return `ca. ${c.year_issued}`;
  if (c.year_qualifier === 'before') return `–${c.year_issued}`;
  if (c.year_qualifier === 'decade') return `${c.year_issued}0-åra`;
  return String(c.year_issued);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
