<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norske Notetrykk 1811–1908</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Source+Serif+4:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f7f4ee;
    --paper:   #fffef9;
    --ink:     #1a1814;
    --muted:   #7a7060;
    --faint:   #e8e2d4;
    --accent:  #8b3a1e;
    --accent2: #2a5c45;
    --border:  #d4cdc0;
    --serif:   'Playfair Display', Georgia, serif;
    --body:    'Source Serif 4', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--body); background: var(--bg); color: var(--ink); min-height: 100vh; }
  header { background: var(--paper); border-bottom: 2px solid var(--border); padding: 2rem 2rem 0; text-align: center; position: relative; }
  .site-title { font-family: var(--serif); font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 700; letter-spacing: -0.02em; color: var(--ink); line-height: 1.05; }
  .site-subtitle { font-family: var(--body); font-size: 0.82rem; color: var(--muted); margin-top: 0.4rem; font-weight: 300; letter-spacing: 0.14em; text-transform: uppercase; }
  .header-about { font-family: var(--body); font-size: 0.82rem; font-style: italic; color: var(--muted); margin-top: 0.5rem; margin-bottom: 1.2rem; }
  .header-search { max-width: 860px; margin: 0 auto 1.2rem; padding: 0 1rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 2; min-width: 220px; }
  .search-wrap-publisher { position: relative; flex: 1; min-width: 150px; }
  .search-wrap-year { position: relative; flex: 1; min-width: 150px; }
  .search-label { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.25rem; padding-left: 0.25rem; }
  .search-input { width: 100%; padding: 0.6rem 1rem 0.6rem 2.5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-family: var(--body); font-size: 0.95rem; color: var(--ink); outline: none; transition: border-color 0.15s; }
  .search-input:focus { border-color: var(--accent); background: var(--paper); }
  .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search-results { position: absolute; left: 0; right: 0; background: var(--paper); border: 1px solid var(--border); border-radius: 8px; margin-top: 0.4rem; overflow: hidden; display: none; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .search-result-item { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid var(--faint); cursor: pointer; text-decoration: none; transition: background 0.1s; color: inherit; }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--faint); }
  .search-result-title { font-family: var(--serif); font-size: 0.93rem; color: var(--ink); }
  .search-result-meta { font-size: 0.78rem; color: var(--muted); text-align: right; }
  .search-section-label { padding: 0.35rem 1rem; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; background: var(--bg); border-bottom: 1px solid var(--faint); }
  .search-empty { padding: 1rem; text-align: center; color: var(--muted); font-size: 0.88rem; }
  nav { display: flex; justify-content: center; background: var(--paper); border-bottom: 1px solid var(--border); }
  .tab { padding: 0.9rem 2.5rem; font-family: var(--body); font-size: 0.88rem; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; white-space: nowrap; user-select: none; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .section-panel { display: none; }
  .section-panel.active { display: block; }
  .section-header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .section-title { font-family: var(--serif); font-size: 1.5rem; font-weight: 500; }
  .section-count { font-size: 0.82rem; color: var(--muted); }
  .alpha-bar { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 1.5rem; }
  .alpha-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-family: var(--body); font-weight: 500; color: var(--muted); background: var(--paper); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
  .alpha-btn:hover { background: var(--faint); color: var(--ink); }
  .alpha-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .alpha-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }
  .composer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.6rem; }
  .composer-card { background: var(--paper); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 6px; padding: 0.7rem 0.9rem; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; text-decoration: none; display: block; color: inherit; }
  .composer-card.tier-1 { border-left-color: #c8c0b0; }
  .composer-card.tier-2 { border-left-color: #c8902a; }
  .composer-card.tier-3 { border-left-color: #3a6ea8; }
  .composer-card.tier-4 { border-left-color: #cc2200; }
  .composer-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(139,58,30,0.1); }
  .composer-name { font-family: var(--serif); font-size: 0.95rem; font-weight: 500; color: var(--ink); line-height: 1.3; }
  .composer-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .score-count { font-size: 0.75rem; color: var(--accent2); }
  .anon-badge { font-size: 0.68rem; background: #f0ece4; color: #7a6a50; border: 1px solid #d4c8b0; border-radius: 3px; padding: 1px 5px; }
  .letter-group { margin-bottom: 1.5rem; }
  .letter-heading { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; color: var(--accent); opacity: 0.6; border-left: 3px solid var(--accent); padding-left: 0.6rem; margin-bottom: 0.6rem; line-height: 1; }
  .publisher-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .publisher-card { background: var(--paper); border: 1px solid var(--border); border-left: 4px solid var(--accent2); border-radius: 6px; padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; text-decoration: none; color: inherit; }
  .publisher-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(139,58,30,0.08); }
  .publisher-card.is-self { border-left-color: #7a5c2a; }
  .publisher-card.is-unknown { border-left-color: #aaa; opacity: 0.7; }
  .publisher-name { font-family: var(--serif); font-size: 1rem; font-weight: 500; color: var(--ink); }
  .publisher-city { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .pub-count { font-size: 0.82rem; color: var(--accent2); white-space: nowrap; flex-shrink: 0; }
  .pub-badge { font-size: 0.68rem; padding: 2px 7px; border-radius: 3px; border: 1px solid; letter-spacing: 0.03em; }
  .pub-badge-self { background: #f5ede0; color: #7a5c2a; border-color: #d4b880; }
  .pub-badge-unknown { background: #f0f0f0; color: #888; border-color: #ccc; }
  .loading-state { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
  .loading-dots::after { content: '...'; animation: dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'} }
  footer { text-align: center; padding: 1.5rem; font-size: 0.78rem; color: var(--muted); border-top: 1px solid var(--border); letter-spacing: 0.04em; }
</style>
</head>
<body>
<header>
  <h1 class="site-title">Norske Notetrykk 1811–1908</h1>
  <p class="site-subtitle">Historisk musikkkatalog</p>
  <p class="header-about">Basert på Kari Michelsen's arbeid ved Universitetet i Oslo</p>
  <div class="header-search">
    <div class="search-wrap">
      <label class="search-label">Tittel / Komponist</label>
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" style="top:calc(50% + 10px)"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input class="search-input" id="globalSearch" type="text" placeholder="Tittel eller komponist…" oninput="handleSearch(this.value)" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="search-wrap-publisher">
      <label class="search-label">Platenummer</label>
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="top:calc(50% + 10px)"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <input class="search-input" type="text" placeholder="Platenummer…" oninput="handlePlateSearch(this.value)" onkeydown="handlePlateKeydown(event)" autocomplete="off">
      <div class="search-results" id="plateSearchResults"></div>
    </div>
    <div class="search-wrap-year">
      <label class="search-label">Utgivelsesår</label>
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="top:calc(50% + 10px)"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <input class="search-input" type="text" inputmode="numeric" placeholder="År, f.eks. 1878…" oninput="handleYearSearch(this.value)" onkeydown="handleYearKeydown(event)" autocomplete="off">
      <div class="search-results" id="yearSearchResults"></div>
    </div>
  </div>
</header>
<nav>
  <div class="tab active" data-section="composers" onclick="switchTab('composers')">Komponister</div>
  <div class="tab" data-section="publishers" onclick="switchTab('publishers')">Forlag</div>
  <a class="tab" href="source.html" style="text-decoration:none;">Kildedata</a>
  <a class="tab" href="changes.html" style="text-decoration:none;">Endringer</a>
</nav>
<main>
  <div class="section-panel active" id="panel-composers">
    <div class="section-header">
      <span class="section-title">Komponister</span>
      <span class="section-count" id="count-composers"></span>
    </div>
    <div class="alpha-bar" id="alpha-composers"></div>
    <div id="composers-list"><div class="loading-state"><span class="loading-dots">Laster</span></div></div>
  </div>
  <div class="section-panel" id="panel-publishers">
    <div class="section-header">
      <span class="section-title">Forlag</span>
      <span class="section-count" id="count-publishers"></span>
    </div>
    <div id="publishers-list"><div class="loading-state"><span class="loading-dots">Laster</span></div></div>
  </div>
</main>
<footer>Norske Notetrykk 1811–1908 · Kari Michelsen / Universitetet i Oslo</footer>

<script>
const SUPABASE_URL = 'https://lmsqnyssnxsiibnyguxy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w0SDuDAzg3L0EmtQe4QHDg_T-bW_ADO';
const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

let allComposers = [], allPublishers = [], activeLetter = 'ALL', activeTab = 'composers';
// role_id for Komponist — resolved on load
let komponistRoleId = null;

// Restore tab/letter from the URL so browser back navigation (e.g. from a
// composer page) returns to the same filtered view instead of a reset page.
const initialParams = new URLSearchParams(window.location.search);
if (initialParams.get('letter')) activeLetter = initialParams.get('letter');
if (window.location.hash === '#publishers') activeTab = 'publishers';

function updateURL() {
  const params = new URLSearchParams();
  if (activeLetter !== 'ALL') params.set('letter', activeLetter);
  const qs = params.toString();
  const hash = activeTab === 'publishers' ? '#publishers' : '';
  history.replaceState(null, '', `index.html${qs?'?'+qs:''}${hash}`);
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.section === tab));
  document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${tab}`).classList.add('active');
  updateURL();
}

async function fetchAll(path) {
  let rows = [], offset = 0;
  while (true) {
    const sep = path.includes('?') ? '&' : '?';
    const r = await fetch(`${SUPABASE_URL}${path}${sep}limit=1000&offset=${offset}`, { headers: H });
    const batch = await r.json();
    if (!Array.isArray(batch) || !batch.length) break;
    rows = rows.concat(batch);
    if (batch.length < 1000) break;
    offset += 1000;
  }
  return rows;
}

async function fetchComposers() {
  // Get role_id for Komponist
  const roles = await fetch(`${SUPABASE_URL}/rest/v1/role?role_name=eq.Komponist&select=role_id`, { headers: H }).then(r => r.json());
  komponistRoleId = roles[0]?.role_id;

  const persons = await fetchAll('/rest/v1/person?select=person_id,last_name,first_name,person_type&order=last_name.asc');

  // Count publications per person (as Komponist)
  const countMap = {};
  if (komponistRoleId) {
    const ppRows = await fetchAll(`/rest/v1/publication_person?role_id=eq.${komponistRoleId}&select=person_id`);
    ppRows.forEach(r => { countMap[r.person_id] = (countMap[r.person_id] || 0) + 1; });
  }

  allComposers = persons
    .map(p => ({ ...p, score_count: countMap[p.person_id] || 0 }))
    .filter(p => p.score_count > 0 || p.person_type !== 'person');

  renderComposers();
}

function renderComposers() {
  const filtered = activeLetter === 'ALL'
    ? allComposers
    : allComposers.filter(c => (c.last_name || '?')[0].toUpperCase() === activeLetter);

  const letters = [...new Set(allComposers.map(c => (c.last_name || '?')[0].toUpperCase()))].sort((a,b) => a.localeCompare(b,'no'));
  document.getElementById('alpha-composers').innerHTML =
    `<div class="alpha-btn ${activeLetter==='ALL'?'active':''}" onclick="setLetter('ALL')">Alle</div>` +
    'ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ'.split('').map(l =>
      `<div class="alpha-btn ${!letters.includes(l)?'disabled':''} ${activeLetter===l?'active':''}" onclick="setLetter('${l}')">${l}</div>`
    ).join('');

  document.getElementById('count-composers').textContent = `${allComposers.length} person${allComposers.length!==1?'er':''}`;

  const groups = {};
  filtered.forEach(c => {
    const l = (c.last_name || '?')[0].toUpperCase();
    if (!groups[l]) groups[l] = [];
    groups[l].push(c);
  });

  const container = document.getElementById('composers-list');
  if (!filtered.length) { container.innerHTML = '<div class="loading-state">Ingen treff</div>'; return; }
  container.innerHTML = Object.entries(groups).sort(([a],[b]) => a.localeCompare(b,'no'))
    .map(([letter, list]) => `
      <div class="letter-group">
        <div class="letter-heading">${letter}</div>
        <div class="composer-grid">${list.map(composerCard).join('')}</div>
      </div>`).join('');
}

function composerCard(c) {
  const name = c.last_name ? (c.first_name ? `${c.last_name}, ${c.first_name}` : c.last_name) : (c.first_name || '—');
  const n = c.score_count;
  const tier = n >= 20 ? 'tier-4' : n >= 6 ? 'tier-3' : n >= 2 ? 'tier-2' : 'tier-1';
  const isAnon = c.person_type === 'anon' || c.person_type === 'collection';
  return `
    <a class="composer-card ${tier}" href="composer.html?id=${c.person_id}">
      <div class="composer-name">${name}</div>
      <div class="composer-meta">
        ${isAnon ? `<span class="anon-badge">${c.person_type==='anon'?'Anon':'Samling'}</span>` : ''}
        <span class="score-count">${n} verk</span>
      </div>
    </a>`;
}

function setLetter(l) { activeLetter = l; renderComposers(); updateURL(); }

async function fetchPublishers() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/publisher?select=publisher_id,publisher_name,city,country,is_self_published,is_unknown&order=publisher_name.asc`, { headers: H });
  const publishers = await r.json();
  if (!Array.isArray(publishers)) { document.getElementById('publishers-list').innerHTML = '<div class="loading-state">Feil ved lasting av forlag</div>'; return; }

  const countMap = {};
  const pubRows = await fetchAll('/rest/v1/publication?select=publisher_id');
  pubRows.forEach(row => { if (row.publisher_id) countMap[row.publisher_id] = (countMap[row.publisher_id] || 0) + 1; });

  allPublishers = publishers.map(p => ({ ...p, comp_count: countMap[p.publisher_id] || 0 }))
    .sort((a,b) => b.comp_count - a.comp_count);

  document.getElementById('count-publishers').textContent = `${allPublishers.length} forlag`;
  document.getElementById('publishers-list').innerHTML = `<div class="publisher-list">
    ${allPublishers.map(p => {
      const cls = p.is_self_published ? 'is-self' : p.is_unknown ? 'is-unknown' : '';
      const badge = p.is_self_published ? '<span class="pub-badge pub-badge-self">Eget forlag</span>'
        : p.is_unknown ? '<span class="pub-badge pub-badge-unknown">Ukjent</span>' : '';
      const city = [p.city, p.country].filter(Boolean).join(', ');
      return `
        <a class="publisher-card ${cls}" href="publisher.html?id=${p.publisher_id}">
          <div>
            <div class="publisher-name">${p.publisher_name || '—'} ${badge}</div>
            ${city ? `<div class="publisher-city">${city}</div>` : ''}
          </div>
          <div class="pub-count">${p.comp_count} verk</div>
        </a>`;
    }).join('')}
  </div>`;
}

// ── Search ────────────────────────────────────────────────
let _searchTimeout = null, _plateTimeout = null, _yearTimeout = null;

function handleSearch(query) {
  clearTimeout(_searchTimeout);
  const el = document.getElementById('searchResults');
  if (!query.trim()) { el.style.display = 'none'; return; }
  _searchTimeout = setTimeout(() => doSearch(query.trim()), 280);
}

function handlePlateSearch(query) {
  clearTimeout(_plateTimeout);
  const el = document.getElementById('plateSearchResults');
  if (!query.trim()) { el.style.display = 'none'; return; }
  _plateTimeout = setTimeout(() => doPlateSearch(query.trim()), 280);
}

function handlePlateKeydown(e) {
  if (e.key !== 'Enter') return;
  const query = e.target.value.trim();
  if (query) window.location = `plate.html?p=${encodeURIComponent(query)}`;
}

function handleYearSearch(query) {
  clearTimeout(_yearTimeout);
  const el = document.getElementById('yearSearchResults');
  if (!query.trim()) { el.style.display = 'none'; return; }
  _yearTimeout = setTimeout(() => doYearSearch(query.trim()), 280);
}

function handleYearKeydown(e) {
  if (e.key !== 'Enter') return;
  const query = e.target.value.trim();
  if (/^\d{3,4}$/.test(query)) window.location = `year.html?y=${query}`;
}

async function doSearch(query) {
  const el = document.getElementById('searchResults');
  el.style.display = 'block'; el.innerHTML = '<div class="search-empty">Søker…</div>';
  const isId = /^\d+$/.test(query);
  let html = '';
  try {
    if (isId) {
      const rows = await fetch(`${SUPABASE_URL}/rest/v1/publication?publication_id=eq.${query}&select=publication_id,title,year_issued&limit=5`, { headers: H }).then(r => r.json());
      if (rows.length) {
        html += `<div class="search-section-label">Publikasjon ID</div>`;
        rows.forEach(c => { html += `<a class="search-result-item" href="publication.html?id=${c.publication_id}"><span class="search-result-title">${c.title||'—'}</span><span class="search-result-meta">#${c.publication_id}${c.year_issued?' · '+c.year_issued:''}</span></a>`; });
      }
    }
    const titles = await fetch(`${SUPABASE_URL}/rest/v1/publication?title=ilike.*${encodeURIComponent(query)}*&select=publication_id,title,year_issued&order=title.asc&limit=6`, { headers: H }).then(r => r.json());
    if (titles.length) {
      html += `<div class="search-section-label">Verk</div>`;
      titles.forEach(c => { html += `<a class="search-result-item" href="publication.html?id=${c.publication_id}"><span class="search-result-title">${c.title}</span><span class="search-result-meta">${c.year_issued||''}</span></a>`; });
    }
    const persons = await fetch(`${SUPABASE_URL}/rest/v1/person?or=(last_name.ilike.*${encodeURIComponent(query)}*,first_name.ilike.*${encodeURIComponent(query)}*)&select=person_id,first_name,last_name&order=last_name.asc&limit=5`, { headers: H }).then(r => r.json());
    if (persons.length) {
      html += `<div class="search-section-label">Komponister</div>`;
      persons.forEach(p => { const name = [p.last_name, p.first_name].filter(Boolean).join(', '); html += `<a class="search-result-item" href="composer.html?id=${p.person_id}"><span class="search-result-title">${name}</span><span class="search-result-meta">→ komponistside</span></a>`; });
    }
    if (!html) html = '<div class="search-empty">Ingen treff</div>';
  } catch(e) { html = '<div class="search-empty">Søkefeil</div>'; }
  el.innerHTML = html;
}

async function doPlateSearch(query) {
  const el = document.getElementById('plateSearchResults');
  el.style.display = 'block'; el.innerHTML = '<div class="search-empty">Søker…</div>';
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/publication?plate_number=ilike.*${encodeURIComponent(query)}*&select=publication_id,title,year_issued,plate_number&order=plate_number.asc&limit=8`, { headers: { ...H, Prefer: 'count=exact' } });
    const rows = await r.json();
    if (!rows.length) { el.innerHTML = '<div class="search-empty">Ingen treff</div>'; return; }
    const total = parseInt((r.headers.get('content-range') || '').split('/')[1], 10) || rows.length;
    let html = rows.map(c => `<a class="search-result-item" href="publication.html?id=${c.publication_id}"><span class="search-result-title">${c.title||'—'}</span><span class="search-result-meta">Pl. ${c.plate_number}${c.year_issued?' · '+c.year_issued:''}</span></a>`).join('');
    if (total > rows.length) html += `<a class="search-result-item" href="plate.html?p=${encodeURIComponent(query)}" style="justify-content:center;color:var(--accent);font-weight:500;">Vis alle ${total} treff for «${query}» →</a>`;
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="search-empty">Søkefeil</div>'; }
}

async function doYearSearch(query) {
  const el = document.getElementById('yearSearchResults');
  if (!/^\d{3,4}$/.test(query)) { el.style.display = 'block'; el.innerHTML = '<div class="search-empty">Skriv et årstall, f.eks. 1878</div>'; return; }
  el.style.display = 'block'; el.innerHTML = '<div class="search-empty">Søker…</div>';
  const year = parseInt(query, 10);
  const decadeStart = Math.floor(year / 10) * 10;
  const filter = `or=(year_issued.eq.${year},and(year_issued.lte.${year},year_issued_end.gte.${year}),and(year_qualifier.eq.decade,year_issued.eq.${decadeStart}))`;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/publication?${filter}&select=publication_id,title,year_issued,year_issued_end,year_qualifier,plate_number&order=title.asc&limit=5`, { headers: { ...H, Prefer: 'count=exact' } });
    const rows = await r.json();
    if (!rows.length) { el.innerHTML = '<div class="search-empty">Ingen treff</div>'; return; }
    const total = parseInt((r.headers.get('content-range') || '').split('/')[1], 10) || rows.length;
    const yearLabel = c => c.year_qualifier === 'range' ? `${c.year_issued}–${c.year_issued_end}`
      : c.year_qualifier === 'decade' ? `${c.year_issued}-årene`
      : c.year_qualifier === 'circa' ? `${c.year_issued} ca`
      : c.year_qualifier === 'before' ? `–${c.year_issued}`
      : `${c.year_issued}`;
    let html = rows.map(c => `<a class="search-result-item" href="publication.html?id=${c.publication_id}"><span class="search-result-title">${c.title||'—'}</span><span class="search-result-meta">${yearLabel(c)}${c.plate_number?' · Pl. '+c.plate_number:''}</span></a>`).join('');
    html += `<a class="search-result-item" href="year.html?y=${year}" style="justify-content:center;color:var(--accent);font-weight:500;">Vis alle ${total} utgivelser fra ${year} →</a>`;
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="search-empty">Søkefeil</div>'; }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.header-search')) {
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('plateSearchResults').style.display = 'none';
    document.getElementById('yearSearchResults').style.display = 'none';
  }
});

if (activeTab === 'publishers') switchTab('publishers');
fetchComposers();
fetchPublishers();
</script>
