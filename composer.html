<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komponist — Norske Notetrykk</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Source+Serif+4:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f7f4ee;
    --paper:   #fffef9;
    --ink:     #1a1814;
    --muted:   #7a7060;
    --faint:   #e8e2d4;
    --accent:  #8b3a1e;
    --accent2: #2a5c45;
    --border:  #d4cdc0;
    --serif:   'Playfair Display', Georgia, serif;
    --body:    'Source Serif 4', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--body); background: var(--bg); color: var(--ink); min-height: 100vh; }

  /* ── Header ── */
  .site-header {
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .back-link {
    font-size: 0.82rem;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--accent); }
  .site-name {
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
  }
  .site-name:hover { color: var(--accent); }

  /* ── Main ── */
  main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* ── Composer hero ── */
  .composer-hero {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem;
    margin-bottom: 2rem;
  }
  .composer-name {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--ink);
  }
  .composer-born {
    font-size: 1rem;
    color: var(--muted);
    margin-top: 0.3rem;
    font-weight: 300;
  }
  .badges { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; }
  .badge {
    font-size: 0.75rem; padding: 3px 10px;
    border-radius: 4px; border: 1px solid;
    letter-spacing: 0.03em;
  }
  .badge-anon    { background: #f0ece4; color: #7a6a50; border-color: #d4c8b0; }
  .badge-collect { background: #eaf0ea; color: #3a5c3a; border-color: #b8d4b8; }

  .bio-text {
    font-size: 0.93rem;
    line-height: 1.75;
    color: var(--ink);
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--faint);
  }

  /* Pseudonym callout */
  .pseudonym-block {
    margin-top: 1rem;
    padding: 0.6rem 0.9rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .pseudonym-block strong { color: var(--ink); font-style: italic; }

  /* ── Scores section ── */
  .scores-heading {
    font-family: var(--serif);
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 1rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .scores-heading-count {
    font-family: var(--body);
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 400;
  }

  /* ── Score table ── */
  .score-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  .score-table th {
    font-family: var(--body);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 500;
    text-align: left;
    padding: 0.4rem 0.75rem 0.6rem;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }
  .score-table th.right { text-align: right; }

  .score-table tr.score-row {
    border-bottom: 1px solid var(--faint);
    transition: background 0.1s;
    cursor: pointer;
  }
  .score-table tr.score-row:last-child { border-bottom: none; }
  .score-table tr.score-row:hover { background: var(--paper); }

  .score-table td {
    padding: 0.65rem 0.75rem;
    vertical-align: top;
    color: var(--ink);
  }
  .score-table td.id-cell {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    width: 3.5rem;
  }
  .score-title-cell .title {
    font-family: var(--serif);
    font-weight: 500;
    color: var(--ink);
    line-height: 1.3;
  }
  .score-title-cell .subtitle {
    font-size: 0.8rem;
    color: var(--muted);
    font-style: italic;
    margin-top: 1px;
  }
  .score-title-cell .lyricist {
    font-size: 0.78rem;
    color: var(--accent2);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .score-table td.year-cell {
    white-space: nowrap;
    color: var(--muted);
    font-size: 0.82rem;
    width: 6rem;
  }
  .score-table td.publisher-cell {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.35;
  }
  .plate-num {
    font-size: 0.72rem;
    color: #aaa;
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .instr-badge {
    display: inline-block;
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--bg);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  /* ── Sortable headers ── */
  .score-table th.sortable {
    cursor: pointer; user-select: none;
  }
  .score-table th.sortable:hover { color: var(--ink); }
  .score-table th.sort-asc::after  { content: ' ↑'; font-size: 0.65rem; }
  .score-table th.sort-desc::after { content: ' ↓'; font-size: 0.65rem; }

  /* ── Sortable headers ── */
  .score-table th.sortable { cursor: pointer; user-select: none; }
  .score-table th.sortable:hover { color: var(--ink); }
  .score-table th.sort-asc::after  { content: ' ↑'; font-size: 0.65rem; }
  .score-table th.sort-desc::after { content: ' ↓'; font-size: 0.65rem; }
  .instr-badge.raw { border-color: #c8a84b; color: #7a5c2a; background: #fdf6e3; }

  /* ── Loading / error ── */
  .loading-state { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
  .error-state   { color: #a32d2d; font-size: 0.9rem; padding: 1.5rem 0; }

  /* ── Responsive: collapse table on narrow screens ── */
  @media (max-width: 600px) {
    .score-table th.hide-sm,
    .score-table td.hide-sm { display: none; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="back-link" href="index.html">← Tilbake</a>
  <a class="site-name" href="index.html">Norske Notetrykk 1811–1908</a>
</header>

<main>
  <div id="content"><div class="loading-state">Laster…</div></div>
</main>

<script>
// ── CONFIG — replace with your catalogue project credentials ──────────────────
const SUPABASE_URL = 'https://lmsqnyssnxsiibnyguxy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w0SDuDAzg3L0EmtQe4QHDg_T-bW_ADO';
const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

const params   = new URLSearchParams(window.location.search);
const personId = params.get('id');

async function load() {
  const el = document.getElementById('content');
  if (!personId) {
    el.innerHTML = '<p class="error-state">Ingen person-ID angitt.</p>';
    return;
  }

  try {
    // 1. Person
    const pR = await fetch(
      `${SUPABASE_URL}/rest/v1/person?person_id=eq.${personId}&select=person_id,last_name,first_name,born,bio_text,person_type,notes`,
      { headers: H }
    );
    const person = (await pR.json())[0];
    if (!person) throw new Error('Person ikke funnet');
    document.title = `${person.last_name || person.first_name} — Norske Notetrykk`;

    // 2. Pseudonyms
    const psR = await fetch(
      `${SUPABASE_URL}/rest/v1/pseudonym?person_id=eq.${personId}&select=pseudonym_name,pseudonym_source`,
      { headers: H }
    );
    const pseudonyms = await psR.json();

    // 3. composition_person rows (all roles)
    const cpR = await fetch(
      `${SUPABASE_URL}/rest/v1/composition_person?person_id=eq.${personId}&select=composition_id,role,credited_as,is_primary`,
      { headers: H }
    );
    const cpRows = await cpR.json();
    const composerCompIds = [...new Set(
      cpRows.filter(r => r.role === 'Composer').map(r => r.composition_id)
    )];

    // 4. Compositions
    let compositions = [];
    if (composerCompIds.length) {
      const ids = composerCompIds.join(',');
      const cR = await fetch(
        `${SUPABASE_URL}/rest/v1/composition?composition_id=in.(${ids})&select=composition_id,title,subtitle,year_issued,year_issued_end,year_qualifier,plate_number,publisher_id,instrumentation_id,raw_instrumentation,composition_notes&order=year_issued.asc,title.asc`,
        { headers: H }
      );
      compositions = await cR.json();
    }

    // 5. Publishers (for these compositions)
    const pubIds = [...new Set(compositions.map(c => c.publisher_id).filter(Boolean))];
    const pubMap = {};
    if (pubIds.length) {
      const prR = await fetch(
        `${SUPABASE_URL}/rest/v1/publisher?publisher_id=in.(${pubIds.join(',')})&select=publisher_id,publisher_name,city`,
        { headers: H }
      );
      (await prR.json()).forEach(p => { pubMap[p.publisher_id] = p; });
    }

    // 6. Instrumentations — load all codes so raw_instrumentation can also be resolved
    const instrIds = [...new Set(compositions.map(c => c.instrumentation_id).filter(Boolean))];
    const instrMap = {};      // instrumentation_id → {description_no}
    const rawCodeMap = {};    // legacy_code → description_no
    const iR = await fetch(
      `${SUPABASE_URL}/rest/v1/instrumentation?select=instrumentation_id,legacy_code,description_no`,
      { headers: H }
    );
    (await iR.json()).forEach(i => {
      instrMap[i.instrumentation_id] = i;
      if (i.legacy_code) rawCodeMap[i.legacy_code] = i.description_no;
    });

    // 7. Lyricists for these compositions
    const lyricistMap = {}; // composition_id → [{name}]
    if (composerCompIds.length) {
      const lyrR = await fetch(
        `${SUPABASE_URL}/rest/v1/composition_person?composition_id=in.(${composerCompIds.join(',')})&role=eq.Lyricist&select=composition_id,person_id,credited_as`,
        { headers: H }
      );
      const lyrRows = await lyrR.json();
      const lyrPersonIds = [...new Set(lyrRows.map(r => r.person_id).filter(Boolean))];
      const lyrPersonMap = {};
      if (lyrPersonIds.length) {
        const lpR = await fetch(
          `${SUPABASE_URL}/rest/v1/person?person_id=in.(${lyrPersonIds.join(',')})&select=person_id,last_name,first_name`,
          { headers: H }
        );
        (await lpR.json()).forEach(p => { lyrPersonMap[p.person_id] = p; });
      }
      lyrRows.forEach(row => {
        if (!lyricistMap[row.composition_id]) lyricistMap[row.composition_id] = [];
        const p = lyrPersonMap[row.person_id];
        const name = row.credited_as
          || (p ? [p.first_name, p.last_name].filter(Boolean).join(' ') : '—');
        lyricistMap[row.composition_id].push(name);
      });
    }

    // ── Render ────────────────────────────────────────────────────────────────

    const displayName = person.last_name
      ? (person.first_name ? `${person.last_name}, ${person.first_name}` : person.last_name)
      : (person.first_name || '—');
    const isAnon    = person.person_type === 'anon';
    const isCollect = person.person_type === 'collection';

    const pseudoHtml = pseudonyms.length ? `
      <div class="pseudonym-block">
        Pseudonym: ${pseudonyms.map(ps =>
          `<strong>${ps.pseudonym_name}</strong>${ps.pseudonym_source ? ` <span style="font-size:0.78rem">(${ps.pseudonym_source})</span>` : ''}`
        ).join(' · ')}
      </div>` : '';

    const heroHtml = `
      <div class="composer-hero">
        <h1 class="composer-name">${displayName}</h1>
        ${person.born ? `<p class="composer-born">f. ${person.born}</p>` : ''}
        <div class="badges">
          ${isAnon    ? '<span class="badge badge-anon">Anonym</span>' : ''}
          ${isCollect ? '<span class="badge badge-collect">Samling</span>' : ''}
        </div>
        ${pseudoHtml}
        ${person.bio_text ? `<div class="bio-text">${person.bio_text.replace(/\n/g, '<br>')}</div>` : ''}
        ${person.notes    ? `<div class="bio-text" style="font-size:0.82rem;color:var(--muted);font-style:italic">${person.notes}</div>` : ''}
      </div>`;

    // Score table
    const scoreTableHtml = compositions.length === 0
      ? '<div class="loading-state">Ingen komposisjoner funnet.</div>'
      : `
        <table class="score-table">
          <thead>
            <tr>
              <th>ID</th>
              <th class="sortable" data-sort="title" id="th-title">Tittel</th>
              <th class="sortable hide-sm" data-sort="year" id="th-year">År</th>
              <th class="hide-sm">Forlag</th>
              <th class="hide-sm">Besetning</th>
            </tr>
          </thead>
          <tbody>
            ${compositions.map(c => {
              const pub     = pubMap[c.publisher_id];
              const instr   = instrMap[c.instrumentation_id];
              const lyricists = lyricistMap[c.composition_id] || [];
              const yearStr = formatYear(c);
              const instrParts = [];
              if (instr) instrParts.push(`${instr.description_no} (${instr.legacy_code})`);
              if (c.raw_instrumentation) instrParts.push(`⚠ rå: ${c.raw_instrumentation}`);
              const instrLabel = instrParts.join(' / ');

              return `
                <tr class="score-row" onclick="window.location='composition.html?id=${c.composition_id}'">
                  <td class="id-cell">#${c.composition_id}</td>
                  <td class="score-title-cell">
                    <div class="title">${escHtml(c.title || '—')}</div>
                    ${c.subtitle ? `<div class="subtitle">${escHtml(c.subtitle)}</div>` : ''}
                    ${lyricists.length ? `<div class="lyricist">✍ ${lyricists.map(escHtml).join(', ')}</div>` : ''}
                  </td>
                  <td class="year-cell hide-sm">${yearStr}</td>
                  <td class="publisher-cell hide-sm">
                    ${pub ? escHtml(pub.publisher_name) : '—'}
                    ${pub?.city ? `<br><span style="font-size:0.75rem;color:#aaa">${escHtml(pub.city)}</span>` : ''}
                    ${c.plate_number ? `<div class="plate-num">Pl. ${escHtml(c.plate_number)}</div>` : ''}
                  </td>
                  <td class="hide-sm">
                    ${instrParts.length ? instrParts.map(p =>
                      `<span class="instr-badge${p.startsWith('⚠') ? ' raw' : ''}">${escHtml(p)}</span>`
                    ).join(' ') : ''}
                  </td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;

    el.innerHTML = `
      ${heroHtml}
      <div class="scores-heading">
        Verk
        <span class="scores-heading-count">${compositions.length} komposisjon${compositions.length !== 1 ? 'er' : ''}</span>
      </div>
      ${scoreTableHtml}
    `;

  } catch(e) {
    document.getElementById('content').innerHTML =
      `<p class="error-state">Feil: ${e.message}</p>`;
  }
}

function formatYear(c) {
  if (!c.year_issued) return '—';
  if (c.year_qualifier === 'range' && c.year_issued_end)
    return `${c.year_issued}–${c.year_issued_end}`;
  if (c.year_qualifier === 'circa')   return `ca. ${c.year_issued}`;
  if (c.year_qualifier === 'before')  return `–${c.year_issued}`;
  if (c.year_qualifier === 'decade')  return `${c.year_issued}0-åra`;
  return String(c.year_issued);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
