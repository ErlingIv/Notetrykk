<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komponist — Norske Notetrykk</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Source+Serif+4:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f4ee;--paper:#fffef9;--ink:#1a1814;--muted:#7a7060;--faint:#e8e2d4;--accent:#8b3a1e;--accent2:#2a5c45;--border:#d4cdc0;--serif:'Playfair Display',Georgia,serif;--body:'Source Serif 4',Georgia,serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh}
  .site-header{background:var(--paper);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;gap:1rem}
  .back-link{font-size:0.82rem;color:var(--muted);text-decoration:none;letter-spacing:0.05em;text-transform:uppercase;display:flex;align-items:center;gap:0.3rem;transition:color 0.15s}
  .back-link:hover{color:var(--accent)}
  .site-name{font-family:var(--serif);font-size:1rem;font-weight:500;color:var(--ink);text-decoration:none}
  .site-name:hover{color:var(--accent)}
  main{max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem}
  .composer-hero{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:2rem;margin-bottom:2rem}
  .composer-name{font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;line-height:1.1;color:var(--ink)}
  .badges{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.6rem}
  .badge{font-size:0.75rem;padding:3px 10px;border-radius:4px;border:1px solid;letter-spacing:0.03em}
  .badge-anon{background:#f0ece4;color:#7a6a50;border-color:#d4c8b0}
  .badge-collect{background:#eaf0ea;color:#3a5c3a;border-color:#b8d4b8}
  .bio-text{font-size:0.93rem;line-height:1.75;color:var(--ink);margin-top:1rem;padding-top:1rem;border-top:1px solid var(--faint)}
  .alias-block{margin-top:1rem;padding:0.6rem 0.9rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:0.82rem;color:var(--muted)}
  .alias-block strong{color:var(--ink);font-style:italic}
  .scores-heading{font-family:var(--serif);font-size:1.2rem;font-weight:500;color:var(--ink);margin-bottom:1rem;padding-bottom:0.6rem;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:0.75rem;flex-wrap:wrap}
  .scores-heading-count{font-family:var(--body);font-size:0.82rem;color:var(--muted);font-weight:400}
  .score-table{width:100%;border-collapse:collapse;font-size:0.88rem}
  .score-table th{font-family:var(--body);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:500;text-align:left;padding:0.4rem 0.75rem 0.6rem;border-bottom:2px solid var(--border);white-space:nowrap}
  .score-table tr.score-row{border-bottom:1px solid var(--faint);transition:background 0.1s;cursor:pointer}
  .score-table tr.score-row:last-child{border-bottom:none}
  .score-table tr.score-row:hover{background:var(--paper)}
  .score-table td{padding:0.65rem 0.75rem;vertical-align:top;color:var(--ink)}
  .score-table td.id-cell{font-size:0.75rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;width:3.5rem}
  .score-title-cell .title{font-family:var(--serif);font-weight:500;color:var(--ink);line-height:1.3}
  .score-title-cell .subtitle{font-size:0.8rem;color:var(--muted);font-style:italic;margin-top:1px}
  .score-title-cell .lyricist{font-size:0.78rem;color:var(--accent2);margin-top:3px}
  .score-table td.year-cell{white-space:nowrap;color:var(--muted);font-size:0.82rem;width:6rem}
  .score-table td.publisher-cell{font-size:0.82rem;color:var(--muted);line-height:1.35}
  .plate-num{font-size:0.72rem;color:#aaa;margin-top:1px;font-variant-numeric:tabular-nums}
  .instr-badge{display:inline-block;font-size:0.68rem;padding:1px 6px;border-radius:3px;border:1px solid var(--border);color:var(--muted);background:var(--bg);letter-spacing:0.03em;white-space:nowrap}
  .instr-badge.raw{border-color:#c8a84b;color:#7a5c2a;background:#fdf6e3}
  .score-table th.sortable{cursor:pointer;user-select:none}
  .score-table th.sortable:hover{color:var(--ink)}
  .score-table th.sort-asc::after{content:' ↑';font-size:0.65rem}
  .score-table th.sort-desc::after{content:' ↓';font-size:0.65rem}
  .loading-state{text-align:center;padding:3rem;color:var(--muted);font-size:0.9rem}
  .error-state{color:#a32d2d;font-size:0.9rem;padding:1.5rem 0}
  @media(max-width:600px){.score-table th.hide-sm,.score-table td.hide-sm{display:none}}
</style>
</head>
<body>
<header class="site-header">
  <a class="back-link" href="index.html">← Tilbake</a>
  <a class="site-name" href="index.html">Norske Notetrykk 1811–1908</a>
</header>
<main>
  <div id="content"><div class="loading-state">Laster…</div></div>
</main>
<script>
const SUPABASE_URL = 'https://lmsqnyssnxsiibnyguxy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w0SDuDAzg3L0EmtQe4QHDg_T-bW_ADO';
const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
const params   = new URLSearchParams(window.location.search);
const personId = params.get('id');

function renderTable() {
  const { publications, instrMap, pubMap, lyricistMap } = window._tableData || {};
  if (!publications) return;
  const sortKey = window._sortKey || 'year';
  const sortDir = window._sortDir || 'asc';
  const sorted = [...publications].sort((a,b) => {
    const va = sortKey==='title' ? (a.title||'') : String(a.year_issued||'');
    const vb = sortKey==='title' ? (b.title||'') : String(b.year_issued||'');
    return sortDir==='asc' ? va.localeCompare(vb,'no') : vb.localeCompare(va,'no');
  });
  document.querySelectorAll('.score-table th.sortable').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.dataset.sort===sortKey) th.classList.add(sortDir==='asc'?'sort-asc':'sort-desc');
  });
  const tbody = document.querySelector('.score-table tbody');
  if (!tbody) return;
  tbody.innerHTML = sorted.map(c => {
    const pub = pubMap[c.publisher_id];
    const instr = instrMap[c.publication_id];
    const lyricists = lyricistMap[c.publication_id] || [];
    const instrParts = [];
    if (instr) instrParts.push(`${instr.description_no} (${instr.legacy_code})`);
    if (c.raw_instrumentation) instrParts.push(`⚠ rå: ${c.raw_instrumentation}`);
    return `
      <tr class="score-row" onclick="window.location='publication.html?id=${c.publication_id}'">
        <td class="id-cell">#${c.publication_id}</td>
        <td class="score-title-cell">
          <div class="title">${esc(c.title||'—')}</div>
          ${c.subtitle?`<div class="subtitle">${esc(c.subtitle)}</div>`:''}
          ${lyricists.length?`<div class="lyricist">✍ ${lyricists.map(esc).join(', ')}</div>`:''}
        </td>
        <td class="year-cell hide-sm">${formatYear(c)}</td>
        <td class="publisher-cell hide-sm">
          ${pub?esc(pub.publisher_name):'—'}
          ${pub?.city?`<br><span style="font-size:0.75rem;color:#aaa">${esc(pub.city)}</span>`:''}
          ${c.plate_number?`<div class="plate-num">Pl. ${esc(c.plate_number)}</div>`:''}
        </td>
        <td class="hide-sm">${instrParts.map(p=>`<span class="instr-badge${p.startsWith('⚠')?' raw':''}">${esc(p)}</span>`).join(' ')}</td>
      </tr>`;
  }).join('');
}

async function load() {
  const el = document.getElementById('content');
  if (!personId) { el.innerHTML = '<p class="error-state">Ingen person-ID angitt.</p>'; return; }
  try {
    // 1. Person
    const person = (await fetch(`${SUPABASE_URL}/rest/v1/person?person_id=eq.${personId}&select=*`, { headers: H }).then(r=>r.json()))[0];
    if (!person) throw new Error('Person ikke funnet');
    document.title = `${person.last_name||person.first_name||'Person'} — Norske Notetrykk`;

    // 2. Person aliases
    const aliases = await fetch(`${SUPABASE_URL}/rest/v1/person_alias?person_id=eq.${personId}&select=raw_name,alias_type`, { headers: H }).then(r=>r.json());

    // 3. Role IDs for Komponist and Tekstforfatter
    const roleRows = await fetch(`${SUPABASE_URL}/rest/v1/role?role_name=in.(Komponist,Tekstforfatter)&select=role_id,role_name`, { headers: H }).then(r=>r.json());
    const komponistId   = roleRows.find(r=>r.role_name==='Komponist')?.role_id;
    const tekstforfatterId = roleRows.find(r=>r.role_name==='Tekstforfatter')?.role_id;

    // 4. publication_person rows for this person
    const ppRows = await fetch(`${SUPABASE_URL}/rest/v1/publication_person?person_id=eq.${personId}&select=publication_id,role_id,credited_as,is_primary`, { headers: H }).then(r=>r.json());
    const composerPubIds = [...new Set(ppRows.filter(r=>r.role_id===komponistId).map(r=>r.publication_id))];

    // 5. Publications where this person is composer
    let publications = [];
    if (composerPubIds.length) {
      publications = await fetch(
        `${SUPABASE_URL}/rest/v1/publication?publication_id=in.(${composerPubIds.join(',')})&select=publication_id,title,subtitle,year_issued,year_issued_end,year_qualifier,plate_number,publisher_id,composition_notes&order=year_issued.asc,title.asc`,
        { headers: H }
      ).then(r=>r.json());
    }

    // 6. Publishers
    const pubIds = [...new Set(publications.map(c=>c.publisher_id).filter(Boolean))];
    const pubMap = {};
    if (pubIds.length) {
      (await fetch(`${SUPABASE_URL}/rest/v1/publisher?publisher_id=in.(${pubIds.join(',')})&select=publisher_id,publisher_name,city`, { headers: H }).then(r=>r.json()))
        .forEach(p => pubMap[p.publisher_id] = p);
    }

    // 7. Instrumentation via publication_instrumentation
    const instrMap = {}; // publication_id → instrumentation obj
    if (composerPubIds.length) {
      const piRows = await fetch(
        `${SUPABASE_URL}/rest/v1/publication_instrumentation?publication_id=in.(${composerPubIds.join(',')})&select=publication_id,instrumentation_id,raw_instrumentation`,
        { headers: H }
      ).then(r=>r.json());
      const instrIds = [...new Set(piRows.map(r=>r.instrumentation_id).filter(Boolean))];
      const instrDetails = {};
      if (instrIds.length) {
        (await fetch(`${SUPABASE_URL}/rest/v1/instrumentation?instrumentation_id=in.(${instrIds.join(',')})&select=instrumentation_id,legacy_code,description_no`, { headers: H }).then(r=>r.json()))
          .forEach(i => instrDetails[i.instrumentation_id] = i);
      }
      piRows.forEach(pi => {
        instrMap[pi.publication_id] = instrDetails[pi.instrumentation_id] || (pi.raw_instrumentation ? { description_no: pi.raw_instrumentation, legacy_code: null } : null);
        // Store raw for warning badge
        if (pi.raw_instrumentation && !instrDetails[pi.instrumentation_id]) {
          publications.find(p=>p.publication_id===pi.publication_id)._raw_instr = pi.raw_instrumentation;
        }
      });
    }

    // 8. Lyricists for these publications
    const lyricistMap = {};
    if (composerPubIds.length && tekstforfatterId) {
      const lyrRows = await fetch(
        `${SUPABASE_URL}/rest/v1/publication_person?publication_id=in.(${composerPubIds.join(',')})&role_id=eq.${tekstforfatterId}&select=publication_id,person_id,credited_as`,
        { headers: H }
      ).then(r=>r.json());
      const lyrIds = [...new Set(lyrRows.map(r=>r.person_id).filter(Boolean))];
      const lyrMap = {};
      if (lyrIds.length) {
        (await fetch(`${SUPABASE_URL}/rest/v1/person?person_id=in.(${lyrIds.join(',')})&select=person_id,last_name,first_name`, { headers: H }).then(r=>r.json()))
          .forEach(p => lyrMap[p.person_id] = p);
      }
      lyrRows.forEach(row => {
        if (!lyricistMap[row.publication_id]) lyricistMap[row.publication_id] = [];
        const p = lyrMap[row.person_id];
        lyricistMap[row.publication_id].push(row.credited_as || (p ? [p.last_name, p.first_name].filter(Boolean).join(', ') : '—'));
      });
    }

    // ── Render ──
    const displayName = person.last_name
      ? (person.first_name ? `${person.last_name}, ${person.first_name}` : person.last_name)
      : (person.first_name || '—');
    const isAnon    = person.person_type === 'anon';
    const isCollect = person.person_type === 'collection';

    const aliasHtml = aliases.length ? `
      <div class="alias-block">
        Alias / pseudonym: ${aliases.map(a => `<strong>${a.raw_name}</strong>`).join(' · ')}
      </div>` : '';

    window._tableData = { publications, instrMap, pubMap, lyricistMap };
    window._sortKey = 'year'; window._sortDir = 'asc';

    el.innerHTML = `
      <div class="composer-hero">
        <h1 class="composer-name">${displayName}</h1>
        <div class="badges">
          ${isAnon    ? '<span class="badge badge-anon">Anonym</span>' : ''}
          ${isCollect ? '<span class="badge badge-collect">Samling</span>' : ''}
        </div>
        ${aliasHtml}
        ${person.notes ? `<div class="bio-text" style="font-size:0.82rem;color:var(--muted);font-style:italic">${esc(person.notes)}</div>` : ''}
      </div>
      <div class="scores-heading">
        Verk
        <span class="scores-heading-count">${publications.length} publikasjon${publications.length!==1?'er':''}</span>
      </div>
      ${publications.length===0
        ? '<div class="loading-state">Ingen publikasjoner funnet.</div>'
        : `<table class="score-table">
            <thead><tr>
              <th>ID</th>
              <th class="sortable" data-sort="title">Tittel</th>
              <th class="sortable hide-sm" data-sort="year">År</th>
              <th class="hide-sm">Forlag</th>
              <th class="hide-sm">Besetning</th>
            </tr></thead>
            <tbody></tbody>
          </table>`}
    `;

    if (publications.length > 0) {
      renderTable();
      document.querySelectorAll('.score-table th.sortable').forEach(th => {
        th.addEventListener('click', () => {
          window._sortKey = th.dataset.sort;
          window._sortDir = th.classList.contains('sort-asc') ? 'desc' : 'asc';
          renderTable();
        });
      });
    }
  } catch(e) {
    document.getElementById('content').innerHTML = `<p class="error-state">Feil: ${esc(e.message)}</p>`;
  }
}

function formatYear(c) {
  if (!c.year_issued) return '—';
  if (c.year_qualifier==='range'&&c.year_issued_end) return `${c.year_issued}–${c.year_issued_end}`;
  if (c.year_qualifier==='circa')  return `ca. ${c.year_issued}`;
  if (c.year_qualifier==='before') return `f. ${c.year_issued}`;
  if (c.year_qualifier==='decade') return `${c.year_issued}0-åra`;
  return String(c.year_issued);
}
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

load();
</script>
</body>
</html>
