<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forlag — Norske Notetrykk</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Source+Serif+4:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f7f4ee;
    --paper:   #fffef9;
    --ink:     #1a1814;
    --muted:   #7a7060;
    --faint:   #e8e2d4;
    --accent:  #8b3a1e;
    --accent2: #2a5c45;
    --border:  #d4cdc0;
    --serif:   'Playfair Display', Georgia, serif;
    --body:    'Source Serif 4', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--body); background: var(--bg); color: var(--ink); min-height: 100vh; }

  .site-header {
    background: var(--paper); border-bottom: 1px solid var(--border);
    padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem;
  }
  .back-link {
    font-size: 0.82rem; color: var(--muted); text-decoration: none;
    letter-spacing: 0.05em; text-transform: uppercase;
    display: flex; align-items: center; gap: 0.3rem; transition: color 0.15s;
  }
  .back-link:hover { color: var(--accent); }
  .site-name {
    font-family: var(--serif); font-size: 1rem; font-weight: 500;
    color: var(--ink); text-decoration: none;
  }
  .site-name:hover { color: var(--accent); }

  main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* ── Hero ── */
  .pub-hero {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 10px; padding: 2rem; margin-bottom: 2rem;
  }
  .pub-name {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 700; line-height: 1.1; color: var(--ink);
  }
  .pub-city { font-size: 1rem; color: var(--muted); margin-top: 0.3rem; font-weight: 300; }
  .badges { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; }
  .badge {
    font-size: 0.75rem; padding: 3px 10px;
    border-radius: 4px; border: 1px solid; letter-spacing: 0.03em;
  }
  .badge-self    { background: #f5ede0; color: #7a5c2a; border-color: #d4b880; }
  .badge-unknown { background: #f0f0f0; color: #888; border-color: #ccc; }

  /* ── Scores heading ── */
  .scores-heading {
    font-family: var(--serif); font-size: 1.2rem; font-weight: 500;
    color: var(--ink); margin-bottom: 1rem;
    padding-bottom: 0.6rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap;
  }
  .scores-heading-count { font-family: var(--body); font-size: 0.82rem; color: var(--muted); font-weight: 400; }

  /* ── Score table ── */
  .score-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .score-table th {
    font-family: var(--body); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); font-weight: 500;
    text-align: left; padding: 0.4rem 0.75rem 0.6rem;
    border-bottom: 2px solid var(--border); white-space: nowrap;
  }
  .score-table tr.score-row {
    border-bottom: 1px solid var(--faint); transition: background 0.1s; cursor: pointer;
  }
  .score-table tr.score-row:last-child { border-bottom: none; }
  .score-table tr.score-row:hover { background: var(--paper); }
  .score-table td { padding: 0.65rem 0.75rem; vertical-align: top; color: var(--ink); }
  .score-table td.id-cell {
    font-size: 0.75rem; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums; width: 3.5rem;
  }
  .score-title-cell .title { font-family: var(--serif); font-weight: 500; color: var(--ink); line-height: 1.3; }
  .score-title-cell .subtitle { font-size: 0.8rem; color: var(--muted); font-style: italic; margin-top: 1px; }
  .score-title-cell .composer { font-size: 0.78rem; color: var(--accent); margin-top: 3px; }
  .score-title-cell .lyricist { font-size: 0.78rem; color: var(--accent2); margin-top: 2px; }
  .year-cell { white-space: nowrap; color: var(--muted); font-size: 0.82rem; width: 5rem; }
  .plate-cell { font-size: 0.78rem; color: var(--muted); }
  .instr-badge {
    display: inline-block; font-size: 0.68rem; padding: 1px 6px;
    border-radius: 3px; border: 1px solid var(--border);
    color: var(--muted); background: var(--bg);
  }

  .loading-state { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
  .error-state   { color: #a32d2d; font-size: 0.9rem; padding: 1.5rem 0; }

  @media (max-width: 600px) {
    .score-table th.hide-sm, .score-table td.hide-sm { display: none; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="back-link" href="index.html#publishers">← Forlag</a>
  <a class="site-name" href="index.html">Norske Notetrykk 1811–1908</a>
</header>

<main>
  <div id="content"><div class="loading-state">Laster…</div></div>
</main>

<script>
const SUPABASE_URL = 'https://lmsqnyssnxsiibnyguxy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w0SDuDAzg3L0EmtQe4QHDg_T-bW_ADO';
const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

const params = new URLSearchParams(window.location.search);
const pubId  = params.get('id');

async function load() {
  const el = document.getElementById('content');
  if (!pubId) { el.innerHTML = '<p class="error-state">Ingen forlag-ID angitt.</p>'; return; }

  try {
    // 1. Publisher
    const pR = await fetch(
      `${SUPABASE_URL}/rest/v1/publisher?publisher_id=eq.${pubId}&select=*`,
      { headers: H }
    );
    const pub = (await pR.json())[0];
    if (!pub) throw new Error('Forlag ikke funnet');
    document.title = `${pub.publisher_name} — Norske Notetrykk`;

    // 2. Compositions for this publisher
    const cR = await fetch(
      `${SUPABASE_URL}/rest/v1/composition?publisher_id=eq.${pubId}&select=composition_id,title,subtitle,year_issued,year_issued_end,year_qualifier,plate_number,instrumentation_id,raw_instrumentation&order=year_issued.asc,title.asc`,
      { headers: H }
    );
    const compositions = await cR.json();

    // 3. Instrumentations
    const instrIds = [...new Set(compositions.map(c => c.instrumentation_id).filter(Boolean))];
    const instrMap = {};
    if (instrIds.length) {
      const iR = await fetch(
        `${SUPABASE_URL}/rest/v1/instrumentation?instrumentation_id=in.(${instrIds.join(',')})&select=instrumentation_id,description_no`,
        { headers: H }
      );
      (await iR.json()).forEach(i => { instrMap[i.instrumentation_id] = i; });
    }

    // 4. Composers and lyricists for these compositions
    const compIds = compositions.map(c => c.composition_id);
    const composerMap  = {}; // comp_id → [{name}]
    const lyricistMap  = {};
    if (compIds.length) {
      const cpR = await fetch(
        `${SUPABASE_URL}/rest/v1/composition_person?composition_id=in.(${compIds.join(',')})&role=in.(Composer,Lyricist)&select=composition_id,person_id,role,credited_as`,
        { headers: H }
      );
      const cpRows = await cpR.json();
      const personIds = [...new Set(cpRows.map(r => r.person_id).filter(Boolean))];
      const personMap = {};
      if (personIds.length) {
        const ppR = await fetch(
          `${SUPABASE_URL}/rest/v1/person?person_id=in.(${personIds.join(',')})&select=person_id,first_name,last_name`,
          { headers: H }
        );
        (await ppR.json()).forEach(p => { personMap[p.person_id] = p; });
      }
      cpRows.forEach(row => {
        const p = personMap[row.person_id];
        const name = row.credited_as || (p
          ? [p.last_name, p.first_name].filter(Boolean).join(', ')
          : '—');
        if (row.role === 'Composer') {
          if (!composerMap[row.composition_id]) composerMap[row.composition_id] = [];
          composerMap[row.composition_id].push({ name, id: row.person_id });
        } else {
          if (!lyricistMap[row.composition_id]) lyricistMap[row.composition_id] = [];
          lyricistMap[row.composition_id].push(name);
        }
      });
    }

    // ── Render ────────────────────────────────────────────────────────────────
    const city = [pub.city, pub.country].filter(Boolean).join(', ');

    const heroHtml = `
      <div class="pub-hero">
        <h1 class="pub-name">${escHtml(pub.publisher_name || '—')}</h1>
        ${city ? `<p class="pub-city">${escHtml(city)}</p>` : ''}
        <div class="badges">
          ${pub.is_self_published ? '<span class="badge badge-self">Eget forlag</span>' : ''}
          ${pub.is_unknown ? '<span class="badge badge-unknown">Ukjent</span>' : ''}
        </div>
      </div>`;

    const tableHtml = compositions.length === 0
      ? '<div class="loading-state">Ingen komposisjoner funnet for dette forlaget.</div>'
      : `
        <table class="score-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tittel</th>
              <th class="hide-sm">År</th>
              <th class="hide-sm">Platenr</th>
              <th class="hide-sm">Besetning</th>
            </tr>
          </thead>
          <tbody>
            ${compositions.map(c => {
              const instr = instrMap[c.instrumentation_id];
              const instrLabel = instr ? instr.description_no : (c.raw_instrumentation || '');
              const composers = composerMap[c.composition_id] || [];
              const lyricists = lyricistMap[c.composition_id] || [];
              return `
                <tr class="score-row" onclick="window.location='composition.html?id=${c.composition_id}'">
                  <td class="id-cell">#${c.composition_id}</td>
                  <td class="score-title-cell">
                    <div class="title">${escHtml(c.title || '—')}</div>
                    ${c.subtitle ? `<div class="subtitle">${escHtml(c.subtitle)}</div>` : ''}
                    ${composers.map(cm => `<div class="composer"><a href="composer.html?id=${cm.id}" onclick="event.stopPropagation()">${escHtml(cm.name)}</a></div>`).join('')}
                    ${lyricists.length ? `<div class="lyricist">✍ ${lyricists.map(escHtml).join(', ')}</div>` : ''}
                  </td>
                  <td class="year-cell hide-sm">${formatYear(c) || '—'}</td>
                  <td class="plate-cell hide-sm">${c.plate_number ? escHtml(c.plate_number) : '—'}</td>
                  <td class="hide-sm">${instrLabel ? `<span class="instr-badge">${escHtml(instrLabel)}</span>` : ''}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;

    el.innerHTML = `
      ${heroHtml}
      <div class="scores-heading">
        Verk
        <span class="scores-heading-count">${compositions.length} komposisjon${compositions.length !== 1 ? 'er' : ''}</span>
      </div>
      ${tableHtml}
    `;

  } catch(e) {
    document.getElementById('content').innerHTML =
      `<p class="error-state">Feil: ${e.message}</p>`;
  }
}

function formatYear(c) {
  if (!c.year_issued) return '';
  if (c.year_qualifier === 'range' && c.year_issued_end) return `${c.year_issued}–${c.year_issued_end}`;
  if (c.year_qualifier === 'circa')  return `ca. ${c.year_issued}`;
  if (c.year_qualifier === 'before') return `–${c.year_issued}`;
  if (c.year_qualifier === 'decade') return `${c.year_issued}0-åra`;
  return String(c.year_issued);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
